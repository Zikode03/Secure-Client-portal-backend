name: Backend OpenAPI contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/SecureClientPortal.Api/SecureClientPortal.Api.csproj --configuration Release
      - name: Audit backend dependencies
        shell: bash
        run: |
          dotnet list src/SecureClientPortal.Api/SecureClientPortal.Api.csproj package --vulnerable --include-transitive --no-restore --format json > dependency-audit.json
          python3 -c 'import json; r=json.load(open("dependency-audit.json")); findings=[v for p in r.get("projects",[]) for f in p.get("frameworks",[]) for k in ("topLevelPackages","transitivePackages") for pkg in f.get(k,[]) for v in pkg.get("vulnerabilities",[])]; print(findings); raise SystemExit(bool(findings) or bool(r.get("errors")))'
      - run: dotnet run --project tools/ContractMetadata/ContractMetadata.csproj --configuration Release -- . --check
      - run: dotnet src/SecureClientPortal.Api/bin/Release/net8.0/SecureClientPortal.Api.dll --export-openapi openapi/portal-api.json
      - run: git diff --exit-code -- openapi/portal-api.json
      - run: dotnet test test/SecureClientPortal.Tests/SecureClientPortal.Tests.csproj --configuration Release --verbosity normal --logger "trx;LogFileName=backend-tests.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
      - name: Prepare isolated SQL recovery rehearsal
        timeout-minutes: 5
        shell: bash
        run: |
          secret="$(openssl rand -hex 24)Aa1!"
          echo "::add-mask::$secret"
          echo "SQLCMDPASSWORD=$secret" >> "$GITHUB_ENV"
          export MSSQL_SA_PASSWORD="$secret"
          mkdir -p "$RUNNER_TEMP/portal-recovery-sql"
          command -v setfacl >/dev/null || { sudo apt-get update -qq; sudo apt-get install -y acl; }
          chmod 700 "$RUNNER_TEMP/portal-recovery-sql"
          setfacl -m "u:10001:rwx,d:u:10001:rwx,d:u:$(id -u):rwx,d:u::rwx,d:g::---,d:o::---" "$RUNNER_TEMP/portal-recovery-sql"
          docker run -d --name portal-recovery-sql -e ACCEPT_EULA=Y -e MSSQL_PID=Developer -e MSSQL_SA_PASSWORD -p 127.0.0.1:14433:1433 -v "$RUNNER_TEMP/portal-recovery-sql:/var/opt/mssql/backup" mcr.microsoft.com/mssql/server:2022-latest
      - name: Prove full recovery from encrypted bundle
        timeout-minutes: 5
        shell: bash
        run: dotnet run --project tools/PortalRecovery/PortalRecovery.csproj -c Release -- smoke --server localhost,14433 --user sa --trust-server-certificate --sql-staging /var/opt/mssql/backup --local-staging "$RUNNER_TEMP/portal-recovery-sql"
      - name: Active HTTP security assessment
        timeout-minutes: 5
        env:
          PORTAL_SECURITY_TEST_SQL: "Server=localhost,14433;User ID=sa;Password=${{ env.SQLCMDPASSWORD }};Encrypt=true;TrustServerCertificate=true"
        run: dotnet run --project tools/SecurityProbe/SecurityProbe.csproj -c Release -- .
      - name: Save HTTP security assessment
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-http-assessment
          path: TestResults/security-http-assessment.json
          if-no-files-found: ignore
      - name: Recovery SQL diagnostics
        if: failure()
        run: docker logs portal-recovery-sql 2>&1 | tail -60 || true
      - name: Remove isolated recovery SQL server
        if: always()
        run: docker rm --force portal-recovery-sql || true
