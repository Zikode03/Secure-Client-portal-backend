name: Backend OpenAPI contract

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - run: dotnet build src/SecureClientPortal.Api/SecureClientPortal.Api.csproj --configuration Release
      - name: Audit backend dependencies
        shell: bash
        run: |
          dotnet list src/SecureClientPortal.Api/SecureClientPortal.Api.csproj package --vulnerable --include-transitive --no-restore --format json > dependency-audit.json
          python3 -c 'import json; r=json.load(open("dependency-audit.json")); findings=[v for p in r.get("projects",[]) for f in p.get("frameworks",[]) for k in ("topLevelPackages","transitivePackages") for pkg in f.get(k,[]) for v in pkg.get("vulnerabilities",[])]; print(findings); raise SystemExit(bool(findings) or bool(r.get("errors")))'
      - run: dotnet run --project tools/ContractMetadata/ContractMetadata.csproj --configuration Release -- . --check
      - run: dotnet src/SecureClientPortal.Api/bin/Release/net8.0/SecureClientPortal.Api.dll --export-openapi openapi/portal-api.json
      - run: git diff --exit-code -- openapi/portal-api.json
      - run: dotnet test test/SecureClientPortal.Tests/SecureClientPortal.Tests.csproj --configuration Release --verbosity normal --logger "trx;LogFileName=backend-tests.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: TestResults/*.trx
          if-no-files-found: ignore
